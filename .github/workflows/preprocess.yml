name: Daily Data Preprocessing Pipeline
on:
  schedule:
    - cron: '0 1 * * 1-5'
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # 给流水线推送代码的权限
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy
          
      - name: Run preprocessing pipeline
        run: python preprocess_pipeline.py
          
      - name: Commit and push updated data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add auto_feature_dataset.csv
          git commit -m "Auto-update dataset: $(date +%Y-%m-%d)" || echo "No changes to commit"
          git push
